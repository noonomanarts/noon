name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull and Rebuild Docker
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Ensure login stays inside the locale route
        run: |
          if [ ! -f 'src/app/(site)/[locale]/login/page.tsx' ]; then
            echo "::error::Localized login route missing: src/app/(site)/[locale]/login/page.tsx"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          command_timeout: 70m
          script: |
            set -e

            cd /root/noon

            echo "Preparing working tree..."
            APPLE_PAY_ASSOCIATION="public/.well-known/apple-developer-merchantid-domain-association"
            if [ -e "$APPLE_PAY_ASSOCIATION" ] && ! git ls-files --error-unmatch "$APPLE_PAY_ASSOCIATION" >/dev/null 2>&1; then
              echo "Removing legacy untracked Apple Pay association file..."
              rm -f "$APPLE_PAY_ASSOCIATION"
            fi

            echo "Pulling latest code..."
            git pull --ff-only origin main

            echo "Rebuilding and starting containers..."
            docker compose up -d --build

            echo "Deployment completed successfully."

      - name: Check localized login pages after deployment
        run: |
          for locale in ar en; do
            for attempt in $(seq 1 20); do
              code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 12 "https://noonomanarts.com/${locale}/login" || true)"
              if [ "$code" = "200" ]; then
                echo "/${locale}/login returned HTTP 200"
                break
              fi
              if [ "$attempt" -eq 20 ]; then
                echo "::error::/${locale}/login did not become available (last status: ${code})"
                exit 1
              fi
              sleep 5
            done
          done
