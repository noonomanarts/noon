name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull and Rebuild Docker
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          command_timeout: 70m
          script: |
            set -e

            cd /root/noon

            echo "Preparing working tree..."
            APPLE_PAY_ASSOCIATION="public/.well-known/apple-developer-merchantid-domain-association"
            if [ -e "$APPLE_PAY_ASSOCIATION" ] && ! git ls-files --error-unmatch "$APPLE_PAY_ASSOCIATION" >/dev/null 2>&1; then
              echo "Removing legacy untracked Apple Pay association file..."
              rm -f "$APPLE_PAY_ASSOCIATION"
            fi

            echo "Pulling latest code..."
            git pull --ff-only origin main

            echo "Rebuilding and starting containers..."
            docker compose up -d --build

            echo "Deployment completed successfully."
