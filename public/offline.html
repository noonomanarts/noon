<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f77d6b" />
    <title>Offline — Noon</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      :root {
        --coral: #f77d6b;
        --coral-strong: #ef6b58;
        --text: #211b16;
        --text-muted: #625646;
        --bg: #fffaf6;
        --surface: #ffffff;
        --border: #f1e3d8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Naskh Arabic", "Tajawal", sans-serif;
        color: var(--text);
        background:
          radial-gradient(1200px 600px at 10% -10%, #ffe8de 0%, transparent 60%),
          radial-gradient(900px 600px at 90% 110%, #ffe2d1 0%, transparent 60%),
          var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      main {
        width: min(560px, 92vw);
        padding: 32px 28px;
        border-radius: 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow:
          0 1px 2px rgba(17, 12, 8, 0.04),
          0 20px 60px -20px rgba(17, 12, 8, 0.15);
        text-align: center;
      }
      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--coral) 0%, var(--coral-strong) 100%);
        color: #fff;
        font-weight: 800;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        line-height: 1.25;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .sub {
        margin: 0 0 18px;
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.55;
      }
      .divider {
        height: 1px;
        background: var(--border);
        margin: 18px 0;
      }
      .ar {
        direction: rtl;
        text-align: center;
      }
      .actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 18px;
      }
      button,
      a.btn {
        appearance: none;
        border: 1px solid transparent;
        border-radius: 12px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition:
          transform 120ms ease,
          background-color 180ms ease,
          border-color 180ms ease,
          color 180ms ease;
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--coral) 0%, var(--coral-strong) 100%);
        color: #fff;
        box-shadow: 0 8px 20px -12px rgba(239, 107, 88, 0.7);
      }
      .btn-primary:hover {
        filter: brightness(0.97);
      }
      .btn-ghost {
        background: transparent;
        border-color: var(--border);
        color: var(--text);
      }
      .btn-ghost:hover {
        background: #faf2ec;
      }
      .status {
        margin-top: 14px;
        font-size: 12px;
        color: var(--text-muted);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #d97757;
        box-shadow: 0 0 0 4px rgba(217, 119, 87, 0.18);
      }
      .dot.online {
        background: #10b981;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.18);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #f4efe9;
          --text-muted: #c3b3a2;
          --bg: #14110e;
          --surface: #1d1814;
          --border: #2b241d;
        }
        body {
          background:
            radial-gradient(1200px 600px at 10% -10%, rgba(247, 125, 107, 0.18) 0%, transparent 60%),
            radial-gradient(900px 600px at 90% 110%, rgba(247, 125, 107, 0.12) 0%, transparent 60%),
            var(--bg);
        }
        .btn-ghost:hover {
          background: #26201a;
        }
      }
    </style>
  </head>
  <body>
    <main role="main">
      <div class="logo" aria-hidden="true">N</div>

      <h1>You&rsquo;re offline</h1>
      <p class="sub">
        We couldn&rsquo;t reach the network. Cached pages will still work — try again when you&rsquo;re back online.
      </p>

      <div class="divider" role="presentation"></div>

      <div class="ar">
        <h1 lang="ar">أنت غير متصل بالإنترنت</h1>
        <p class="sub" lang="ar">تعذّر الوصول إلى الشبكة. ستعمل الصفحات المحفوظة، وحاول مجدداً بعد عودة الاتصال.</p>
      </div>

      <div class="actions">
        <button type="button" class="btn-primary" onclick="location.reload()">Try again / أعد المحاولة</button>
        <a class="btn btn-ghost" href="/">Go home / الرئيسية</a>
      </div>

      <div class="status" aria-live="polite">
        <span class="dot" id="dot"></span>
        <span id="status-text">Offline</span>
      </div>
    </main>
    <script>
      (function () {
        var dot = document.getElementById('dot');
        var text = document.getElementById('status-text');
        function update() {
          if (navigator.onLine) {
            dot.classList.add('online');
            text.textContent = 'Back online — reloading…';
            setTimeout(function () {
              location.reload();
            }, 600);
          } else {
            dot.classList.remove('online');
            text.textContent = 'Offline';
          }
        }
        window.addEventListener('online', update);
        window.addEventListener('offline', update);
        update();
      })();
    </script>
  </body>
</html>
